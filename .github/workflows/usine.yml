name: Usine à sites ORBE

on:
  schedule:
    - cron: "17 22,2 * * *"   # 14 nov. 2026 : deux passages la nuit (vers 0 h 15 et 4 h 15, heure de Paris), 5 sites par jour au plus
  push:
    branches: [main]
    paths:
      - "usine.py"
      - "rendu.py"
      - "icones3d.py"
      - "photos.py"
      - "templates/**"
      - "verif.py"
      - "data/commande.json"
      - ".github/workflows/usine.yml"
  workflow_dispatch:
    inputs:
      nombre:
        description: "Combien de sites ?"
        default: "20"
      refaire:
        description: "Refaire les sites récents avec les nouveaux modèles ? (1 = oui)"
        default: "0"
      jours:
        description: "Refaire les sites des N derniers jours (si « refaire » = 1)"
        default: "4"

permissions:
  contents: write

concurrency:
  group: usine
  cancel-in-progress: false

jobs:
  usine:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fabriquer les sites
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Facultatif : clés gratuites pour des photos de qualité studio (sinon Wikimedia Commons).
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # Une mise à jour des modèles (push) refait seulement les sites récents avec le nouveau design.
          NOMBRE: ${{ github.event.inputs.nombre || '20' }}
          REFAIRE_JOURS: ${{ github.event.inputs.jours || '4' }}
          REFAIRE: ${{ github.event_name == 'push' && '1' || github.event.inputs.refaire || '0' }}
        run: |
          mkdir -p data
          set -o pipefail
          python usine.py 2>&1 | tee data/journal.txt
      - name: Mettre en ligne
        if: always()
        run: |
          git config user.name "Usine ORBE"
          git config user.email "usine-orbe@users.noreply.github.com"
          git add -A docs data
          git rm -q --cached data/commande.json 2>/dev/null || true
          git commit -m "Usine : sites du $(date +%F)" || exit 0
          git pull --rebase -X theirs origin main || true
          git push
