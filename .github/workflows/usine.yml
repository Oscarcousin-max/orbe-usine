name: Usine à sites ORBE

on:
  schedule:
    - cron: "17 22 * * *"   # chaque nuit vers 0 h 15 (heure de Paris) : prêt bien avant le robot du matin
    - cron: "43 9 * * *"    # et un second passage vers 11 h 45 : d'autres secteurs, d'autres départements
  push:
    branches: [main]
    paths:
      - "usine.py"
      - "rendu.py"
      - "icones3d.py"
      - "templates/**"
      - ".github/workflows/usine.yml"
  workflow_dispatch:
    inputs:
      nombre:
        description: "Combien de sites ?"
        default: "20"
      refaire:
        description: "Refaire les sites récents avec les nouveaux modèles ? (1 = oui)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: usine
  cancel-in-progress: false

jobs:
  usine:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fabriquer les sites
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Une mise à jour des modèles (push) refait seulement les sites récents avec le nouveau design.
          NOMBRE: ${{ github.event.inputs.nombre || '20' }}
          REFAIRE: ${{ github.event.inputs.refaire || '0' }}
        run: |
          mkdir -p data
          set -o pipefail
          python usine.py 2>&1 | tee data/journal.txt
      - name: Mettre en ligne
        if: always()
        run: |
          git config user.name "Usine ORBE"
          git config user.email "usine-orbe@users.noreply.github.com"
          git add -A docs data
          git commit -m "Usine : sites du $(date +%F)" || exit 0
          git pull --rebase -X theirs origin main || true
          git push
