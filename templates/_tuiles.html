<section class="sec tuiles-sec" id="{{tuiles_id}}"><div class="wrap tuiles-grid">
<div class="tuiles-intro reveal"><span class="eyebrow">{{tuiles_eyebrow}}</span><h2 class="titre-sec">{{exp_titre}}</h2>
<p class="lead">{{tuiles_lead}}</p>
<ol class="tuiles-index" aria-hidden="true"><li>{{e1_t}}</li><li>{{e2_t}}</li><li>{{e3_t}}</li></ol></div>
<div class="tuiles">
<article class="tuile verre" style="--i:0"><div class="ico3d">{{ico1}}</div><div class="tuile-txt"><span class="n">01</span><h3>{{e1_t}}</h3><p>{{e1_d}}</p></div></article>
<article class="tuile verre" style="--i:1"><div class="ico3d">{{ico2}}</div><div class="tuile-txt"><span class="n">02</span><h3>{{e2_t}}</h3><p>{{e2_d}}</p></div></article>
<article class="tuile verre" style="--i:2"><div class="ico3d">{{ico3}}</div><div class="tuile-txt"><span class="n">03</span><h3>{{e3_t}}</h3><p>{{e3_d}}</p><a class="lien-fl" href="#contact">{{cta}} <span class="fl">→</span></a></div></article>
</div></div></section>
